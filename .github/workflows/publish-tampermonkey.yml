name: Publish Tampermonkey bundle

on:
  push:
    branches: [main]
    paths:
      - .github/tampermonkey-payload.b64

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract scripts
        shell: bash
        run: |
          base64 -d .github/tampermonkey-payload.b64 > /tmp/tampermonkey.tar.gz
          tar -xzf /tmp/tampermonkey.tar.gz
          rm .github/tampermonkey-payload.b64
      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts .github/tampermonkey-payload.b64
          git commit -m "Publish current Tampermonkey scripts" || exit 0
          git push
