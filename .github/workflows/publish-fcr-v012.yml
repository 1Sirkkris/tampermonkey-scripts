name: Publish FCResearch Master v0.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fcr-v012.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump published CLEAN TEST version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/FCResearch_Master_CLEAN_TEST.user.js')
          s = p.read_text()
          s = s.replace('// @name         v0.1.0 FCResearch Master CLEAN TEST', '// @name         v0.1.2 FCResearch Master CLEAN TEST', 1)
          s = s.replace('// @version      0.1.0', '// @version      0.1.2', 1)
          s = s.replace('window.__fcrMasterCleanTest_v010', 'window.__fcrMasterCleanTest_v012')
          s = s.replace("const VERSION = '0.1.0';", "const VERSION = '0.1.2';", 1)
          p.write_text(s)
          Path('.github/workflows/publish-fcr-v012.yml').unlink()
          PY
      - name: Commit published version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/FCResearch_Master_CLEAN_TEST.user.js .github/workflows/publish-fcr-v012.yml
          git commit -m "Publish FCResearch Master v0.1.2"
          git push
