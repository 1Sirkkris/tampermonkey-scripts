name: Patch deprecated FCResearch titles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deprecate-old-fcr-titles.yml'

permissions:
  contents: write

jobs:
  patch-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript titles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('scripts/Multiprint_Pandash.user.js'): (
                  '// @name         v1.8.37 Multiprint + Pandash',
                  '// @name         v1.8.37 DEPRECIATED Multiprint + Pandash',
              ),
              Path('scripts/Highlighter_Madcat.user.js'): (
                  '// @name         v2.7 Highlighter + Madcat + Size',
                  '// @name         v2.7 DEPRECIATED Highlighter + Madcat + Size',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected title not found: {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/deprecate-old-fcr-titles.yml').unlink()
          PY
      - name: Commit title changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/Multiprint_Pandash.user.js scripts/Highlighter_Madcat.user.js .github/workflows/deprecate-old-fcr-titles.yml
          git commit -m 'Mark old FCResearch scripts deprecated'
          git push
